name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Validate plugin.xml
        run: |
          test -f resources/META-INF/plugin.xml || (echo "plugin.xml missing" && exit 1)
          echo "plugin.xml exists"
          grep -q "<id>manjaro.ptpb</id>" resources/META-INF/plugin.xml && echo "Plugin ID OK"
          grep -q "<version>" resources/META-INF/plugin.xml && echo "Version OK"
      - name: Check changelog
        run: test -f CHANGELOG.md && echo "CHANGELOG present"
